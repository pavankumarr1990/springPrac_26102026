server.servlet.context-path=/pavan
#server/port=8300

#for debugging
#logging.level.org.springframework.data.eleasticsearch=DEBUG

logging.level.tracer=TRACE

#custom.datasource.driver-class-name=org.postgresql.Driver
#custom.datasource.url=jdbc:postgresql://localhost:5432/Employee
#custom.datasource.username=postgres
#custom.datasource.password=Pavan@123

spring.application.name=prac1
spring.datasource.url=jdbc:postgresql://localhost:5432/Employee
spring.datasource.username=postgres
spring.datasource.password=Pavan@123
spring.jpa.properties.hibernate.default_schema=employee_management

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.format_sql=true
custom.datasource.pool.connection-timeout=30000
custom.datasource.pool.maximum-pool-size=10
custom.datasource.pool.connection-timeout-in-millis=30000
custom.datasource.pool.leak-detection-threshold-in-millis=30000
#custom.datasource.pool.leak-detection-threshold=30000

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui/index.html
# OpenAPI documentation path
springdoc.api-docs.path=/v3/api-docs
# Sort API endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha
# Display API documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
